[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hth"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.1",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "structlog==24.4.0",
    "psutil==6.1.0",
    "python-multipart==0.0.12",
    "pyrnnoise==0.4.5",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.8.1",
    "mypy==1.13.0",
    "types-psutil>=6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hth"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["sounddevice", "sounddevice.*", "numpy", "numpy.*", "psutil", "psutil.*", "pyrnnoise", "pyrnnoise.*"]
ignore_missing_imports = true
